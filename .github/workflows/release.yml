name: Release

# Push a tag like v0.1.0 to publish every package at the version in its package.json.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing: npm exchanges this workflow's OIDC token for a short-lived publish credential,
      # so no NPM_TOKEN secret is stored. Each package must list this repo and release.yml as a trusted publisher.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or newer, which ships with Node 24.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Dependencies first, so each package's internal deps already exist on npm.
      - name: Publish
        run: |
          for pkg in geo-core geo-dashboard geo-next payload-plugin-geo strapi-plugin-geo; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
            else
              npm publish --workspace "packages/$pkg" --access public
            fi
          done
